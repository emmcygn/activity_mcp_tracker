# .github/workflows/daily-weekday-commits.yml
# Daily automation: 1-2 commits on weekdays

name: Daily Weekday Commits

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 9 * * 1-5'  # Monday-Friday at 9 AM UTC

jobs:
  daily-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check if today already has commits
      id: check-commits
      run: |
        TODAY=$(date +%Y-%m-%d)
        echo "Checking for commits on $TODAY"

        # Count commits for today
        COMMIT_COUNT=$(git log --since="$TODAY 00:00:00" --until="$TODAY 23:59:59" --author="emmanuelcuyugan@gmail.com" --oneline | wc -l)
        echo "commit-count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

        if [ $COMMIT_COUNT -gt 0 ]; then
          echo "Found $COMMIT_COUNT commits for today. Skipping."
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "No commits found for today. Proceeding."
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    - name: Create daily commits (1-2)
      if: steps.check-commits.outputs.skip == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        COMMIT_COUNT=$((RANDOM % 2 + 1))
        echo "Creating $COMMIT_COUNT commit(s) for today"

        for i in $(seq 1 "$COMMIT_COUNT"); do
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) daily contribution $i/$COMMIT_COUNT" >> .github/daily-commits.log
          git add .github/daily-commits.log
          git commit -m "chore: daily contribution ($i/$COMMIT_COUNT)"
        done

        git push

    - name: Verify today's commits
      if: steps.check-commits.outputs.skip == 'false'
      run: |
        TODAY=$(date +%Y-%m-%d)
        echo "Commits for $TODAY:"
        git log --since="$TODAY 00:00:00" --until="$TODAY 23:59:59" --author="emmanuelcuyugan@gmail.com" --oneline
        echo "Daily commits completed successfully!"

    - name: Skip notification
      if: steps.check-commits.outputs.skip == 'true'
      run: |
        echo "Skipping commit creation - today already has commits"
